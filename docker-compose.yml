version: '3.8'

services:
  finops-api:
    build: .
    container_name: finops-cost-dashboard
    ports:
      - "8080:8080"
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  redis:
    image: redis:7-alpine
    profiles: ["live"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  postgres:
    image: postgres:15-alpine
    profiles: ["live"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  redisdata:
  pgdata:
